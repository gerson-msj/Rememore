name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/Rememore.Client/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/configure-pages@v5

      - name: Publicar Blazor
        run: dotnet publish src/Rememore.Client/Rememore.Client.csproj -c Release -p:CompressionEnabled=false

      - name: Configurar URL da API no site publicado
        run: |
          sed -i 's|http://localhost:5297/|https://rememore.onrender.com/|' src/Rememore.Client/bin/Release/net10.0/publish/wwwroot/appsettings.json

      - name: Preparar arquivos
        shell: bash
        run: |
          sed -i 's|<base href="/" />|<base href="/Rememore/" />|' src/Rememore.Client/bin/Release/net10.0/publish/wwwroot/index.html
          touch src/Rememore.Client/bin/Release/net10.0/publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: src/Rememore.Client/bin/Release/net10.0/publish/wwwroot

      - id: deploy
        uses: actions/deploy-pages@v4
